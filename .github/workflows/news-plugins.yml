name: News plugins

on:
  pull_request:
    paths:
      - 'packages/politics-digest/**'
      - 'packages/economy-digest/**'
      - 'packages/sports-digest/**'
      - 'packages/trending-topics/**'
      - 'scripts/check_news_plugins.py'
      - '.github/workflows/news-plugins.yml'
  push:
    branches: [main]
    paths:
      - 'packages/politics-digest/**'
      - 'packages/economy-digest/**'
      - 'packages/sports-digest/**'
      - 'packages/trending-topics/**'
      - 'scripts/check_news_plugins.py'
      - '.github/workflows/news-plugins.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [politics-digest, economy-digest, sports-digest, trending-topics]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/${{ matrix.plugin }}/dify/requirements.txt PyYAML
      - run: python -m unittest discover -s packages/${{ matrix.plugin }}/dify/tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/check_news_plugins.py ${{ matrix.plugin }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
