      en_US: Enter your AIsa API key
      ja_JP: AIsa APIキーを入力
    help:
      en_US: Get your key from AIsa Console. Validation checks its format without a paid request.
      ja_JP: AIsa Consoleで取得してください。認証設定時は書式のみを確認し、課金リクエストを送信しません。
    url: https://console.aisa.one
tools:
  - tools/economy-digest.yaml
extra:
  python:
    source: provider/economy_digest.py
